name: Publish downloadable release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v1.0.0'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package app
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir release
          cp index.html README.md LICENSE release/
          (cd release && zip -r "../opic-mock-exam-${RELEASE_TAG}.zip" .)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: OPIc 모의고사 ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: opic-mock-exam-${{ inputs.tag || github.ref_name }}.zip

