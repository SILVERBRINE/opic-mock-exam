name: Publish downloadable release

on:
  push:
    branches:
      - 'v*'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v1.0.0'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package app
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "Invalid release version"; exit 1; }
          grep -Fq "<title>OPIc 모의고사 ${RELEASE_TAG}</title>" index.html || { echo "App version and release tag must match"; exit 1; }
          mkdir release
          cp index.html coi-serviceworker.js README.md LICENSE release/
          mkdir release/docs
          cp docs/ARCHITECTURE.md docs/RELEASE-READINESS.md docs/GEMINI-EVALUATION-REVIEW.md docs/GEMINI-FREE-PLAN-REVIEW.md docs/LOCAL-EVALUATION-REVIEW.md docs/WHISPER-RECOVERY-REVIEW.md docs/SCORING-1.4.4.md docs/SCORING-1.4.5.md release/docs/
          (cd release && zip -r "../opic-mock-exam-${RELEASE_TAG}.zip" .)

      - name: Publish GitHub Release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const tag = process.env.RELEASE_TAG;
            const assetName = `opic-mock-exam-${tag}.zip`;
            let release;

            try {
              release = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
            } catch (error) {
              if (error.status !== 404) throw error;
              release = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: `OPIc 모의고사 ${tag}`,
                generate_release_notes: true
              });
            }

            const data = fs.readFileSync(assetName);
            const existingAsset = release.data.assets.find(asset => asset.name === assetName);
            if (existingAsset) {
              core.notice(`Release asset ${assetName} already exists. Keeping the published file and its download count. Publish changes under a new version.`);
              return;
            }
            await github.rest.repos.uploadReleaseAsset({
              owner,
              repo,
              release_id: release.data.id,
              name: assetName,
              data,
              headers: {
                'content-type': 'application/zip',
                'content-length': data.length
              }
            });
