name: Publish downloadable release

on:
  push:
    branches:
      - 'v*'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v1.0.0'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package app
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir release
          cp index.html README.md LICENSE release/
          (cd release && zip -r "../opic-mock-exam-${RELEASE_TAG}.zip" .)

      - name: Publish GitHub Release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const tag = process.env.RELEASE_TAG;
            const assetName = `opic-mock-exam-${tag}.zip`;
            let release;

            try {
              release = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
            } catch (error) {
              if (error.status !== 404) throw error;
              release = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: `OPIc 모의고사 ${tag}`,
                generate_release_notes: true
              });
            }

            const data = fs.readFileSync(assetName);
            const existingAsset = release.data.assets.find(asset => asset.name === assetName);
            if (existingAsset) {
              await github.rest.repos.deleteReleaseAsset({
                owner,
                repo,
                asset_id: existingAsset.id
              });
            }
            await github.rest.repos.uploadReleaseAsset({
              owner,
              repo,
              release_id: release.data.id,
              name: assetName,
              data,
              headers: {
                'content-type': 'application/zip',
                'content-length': data.length
              }
            });

